name: SoE Multiplayer Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Capacitor Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Configure App Name in Capacitor Config
        run: |
          if [ -f capacitor.config.json ]; then
            node -e '
              const fs = require("fs");
              const config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
              config.appName = "SoE Multiplayer Android";
              fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
            '
          else
            echo '{
              "appId": "com.soe.multiplayer",
              "appName": "SoE Multiplayer Android",
              "webDir": "www",
              "bundledWebRuntime": false
            }' > capacitor.config.json
          fi

      - name: Force Clean Kotlin and Build Configuration
        run: |
          BUILD_FILE="android/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            echo "allprojects { configurations.all { resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24', 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24' } }" >> "$BUILD_FILE"
          fi

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/release.keystore -alias release-key -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=SoE Multiplayer, OU=Dev, O=TVMan, L=Unknown, ST=Unknown, C=US"

      - name: Safely Inject Signing Configuration into Existing Android Block
        run: |
          cat << 'EOF' > inject_sign.py
          import re

          file_path = "android/app/build.gradle"
          with open(file_path, "r") as f:
              content = f.read()

          signing_config = """
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'password123'
                      keyAlias 'release-key'
                      keyPassword 'password123'
                  }
              }
          """

          if "signingConfigs" not in content:
              content = content.replace("android {", signing_config, 1)

          content = re.sub(r'(buildTypes\s*\{[^}]*release\s*\{)', r'\1\n        signingConfig signingConfigs.release\n        minifyEnabled false', content)

          with open(file_path, "w") as f:
              f.write(content)
          EOF
          python3 inject_sign.py
          echo "Successfully injected signing configuration."

      - name: Build Clean Signed Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Rename and Prepare APK
        run: |
          cd android/app/build/outputs/apk/release/
          mv app-release.apk SoE-Multiplayer-Android-release.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOE-signed-release-apk
          path: android/app/build/outputs/apk/release/SoE-Multiplayer-Android-release.apk
